# 評価用 50場面（日本語）
# - 各場面は小さな会議。最後の発言の expect が正解ラベル
#   move: stay_silent | correct | clarify | invite_quiet | refocus（省略時 stay_silent）
#   delivery: direct | cushioned | private_dm_later、またはそのリスト（どれでも正解）。書いた場合のみ採点
#   tatemae: true/false（省略時 false）
# - split: tune = しきい値の調整に使う / test = 調整中は見ない（最後に1回だけ評価）
# - 上位者（senior: true）の事実誤りも訂正する。その場か会議後のDMかは確信度で決まるので、どちらも正解とする
# - 上位者のあいまいな指示の確認は、会議後のDMが正解とする
# - refocus の場面は、議題外の発言がちょうど2つ続いたところで終わる（2つ目で戻すのが正解）

scenes:
# ---------------------------------------------------------------- stay_silent (14)
